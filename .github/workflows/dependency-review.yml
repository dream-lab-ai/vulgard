# Reusable PR gate. Fails when a PR adds or upgrades to a dependency with a known
# vulnerability at or above `fail-on-severity`. Repos call it through the caller
# workflow that `vulnguard rollout` installs; the status check is
# "dependency-review / review".
name: dependency-review

on:
  workflow_call:
    inputs:
      fail-on-severity:
        description: "low | moderate | high | critical"
        type: string
        default: high
      engine:
        description: >-
          "github" uses GitHub's dependency graph (needs GitHub Code Security / GHAS on
          private repos). "osv" uses OSV-Scanner and works on any repo.
        type: string
        default: github
      allow-ghsas:
        description: Comma-separated advisory IDs to accept (with a documented reason).
        type: string
        default: ""

permissions:
  contents: read

jobs:
  github:
    if: inputs.engine == 'github'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: ${{ inputs.fail-on-severity == 'medium' && 'moderate' || inputs.fail-on-severity }}
          allow-ghsas: ${{ inputs.allow-ghsas }}
          comment-summary-in-pr: on-failure

  osv:
    if: inputs.engine == 'osv'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@v2.0.2
    with:
      upload-sarif: false
      fail-on-vuln: true

  # Single stable check name, whichever engine ran.
  review:
    if: always()
    needs: [github, osv]
    runs-on: ubuntu-latest
    steps:
      - name: Verdict
        env:
          GITHUB_RESULT: ${{ needs.github.result }}
          OSV_RESULT: ${{ needs.osv.result }}
        run: |
          echo "github engine: $GITHUB_RESULT, osv engine: $OSV_RESULT"
          for r in "$GITHUB_RESULT" "$OSV_RESULT"; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::This PR introduces a vulnerable dependency. See the dependency review output above."
              exit 1
            fi
          done
